[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/pratala/pratala-near"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

# Integration-test stack documented at docs.near.org/smart-contracts/testing/integration-test
near-sandbox = "0.4.0"
near-api = "0.8.7"
cargo-near-build = "0.11.5"
tokio = { version = "1.41.0", features = ["full"] }
testresult = "0.4.1"
anyhow = "1.0"

[workspace.lints.rust]
# `cfg(near)` was introduced in near-sdk 5.27.0 and is an expected cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
