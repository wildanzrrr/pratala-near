# Pratala local stack: API only — Postgres is external (bring your own).
#   cp backend/.env.example backend/.env   # fill DATABASE_URL (+ GCS_BUCKET + GCS_KEY_FILE, required)
#   docker compose up -d --build
#   curl -s localhost:4100/api/health
# DATABASE_URL comes from backend/.env. Inside the container reach a Postgres
# on the docker host via host "host.docker.internal" (extra_hosts below makes
# that name resolve on Linux servers too); on the dev machine use localhost.
# Evidence photos live in Google Cloud Storage only. Mount the service-account
# JSON and point GCS_KEY_FILE at it, e.g.:
#   volumes: [ "./gcp-service-account.json:/app/secrets/gcs.json:ro" ]
#   environment: GCS_KEY_FILE: /app/secrets/gcs.json
# The NEAR Auth sponsor key mounts the same way (../config/sponsor-key.json on
# the host): mount it read-only and set SPONSOR_PRIVATE_KEY_FILE to the
# container path; without it /api/fastauth/* returns 503 sponsor_unconfigured.

name: pratala

services:
  api:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: '4100'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4100:4100'
    restart: unless-stopped
