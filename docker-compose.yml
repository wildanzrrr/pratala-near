# Pratala local stack: API only — Postgres is external (bring your own).
#   cp backend/.env.example backend/.env   # fill DATABASE_URL (+ GCS_BUCKET + GCS_KEY_FILE, required)
#   docker compose up -d --build
#   curl -s localhost:4100/api/health
# DATABASE_URL comes from backend/.env. Inside the container reach a Postgres
# on the docker host via host "host.docker.internal" (extra_hosts below makes
# that name resolve on Linux servers too); on the dev machine use localhost.
#
# Secrets never enter the image. The gitignored ./config tree (GCS
# service-account JSON + config/keys/*.near.json NEAR keys) is bind-mounted
# read-only at /config: backend/.env's ../config/... paths resolve to /config/...
# inside the container (WORKDIR is /app, so ../config == /config), meaning the
# same .env serves the dev machine and Docker unchanged. Without the mount the
# app crash-loops with ENOENT /config/keys/sponsor.pratala.near.json. The image
# runs as uid 1000 (node), so on a Linux host ./config must be readable by that
# uid — it is when the files belong to the server's admin user (first sudo
# user is uid 1000); check with `id -u` if reads fail with EACCES.

name: pratala

services:
  api:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: '4100'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4100:4100'
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
